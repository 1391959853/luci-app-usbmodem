name: Build luci-app-usbmodem

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: "ramips_mt7621", name: "ramips-mt7621" }
          - { arch: "x86_64", name: "x86-64" }
          - { arch: "aarch64_generic", name: "aarch64-generic" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with openwrt/gh-action-sdk
        uses: openwrt/gh-action-sdk@v2
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE: luci-app-usbmodem
          FEEDS: luci https://github.com/openwrt/luci.git^openwrt-24.10

      - name: Upload artifact (ipk)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-ipk
          path: bin/packages/**/*.ipk

      - name: Prepare release archive
        run: |
          mkdir -p artifacts
          cp bin/packages/**/*.ipk artifacts/ 2>/dev/null || true
          cd artifacts
          tar -czvf ../${{ matrix.name }}.tar.gz .
          cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release
          path: ${{ matrix.name }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-pkgs

      - name: List downloaded artifacts
        run: |
          ls -la release-pkgs/
          find release-pkgs -name "*.tar.gz" -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          body: |
            Automatically built luci-app-usbmodem for:
            - ramips/mt7621 (WG3526, etc.)
            - x86/64
            - aarch64_generic
          artifacts: release-pkgs/*/*.tar.gz
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}