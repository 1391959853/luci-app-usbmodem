name: Build luci-app-usbmodem

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - ramips/mt7621      # WG3526 及 MT7621 设备
          - x86/64
          - aarch64_generic
          # 可根据需要添加更多，例如：
          # - mvebu/cortexa9
          # - ipq40xx/generic

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with openwrt/gh-action-sdk
        uses: openwrt/gh-action-sdk@v2
        env:
          ARCH: ${{ matrix.target }}
          PACKAGE: luci-app-usbmodem
          FEEDS: luci https://github.com/openwrt/luci.git^openwrt-24.10
          # 如果你需要额外 feeds，可以继续添加，例如：
          # FEEDS_PACKAGES: packages https://github.com/openwrt/packages.git^openwrt-24.10

      - name: Upload artifact (ipk)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-ipk
          path: bin/packages/**/*.ipk

      - name: Prepare release archive
        run: |
          mkdir -p artifacts
          cp bin/packages/**/*.ipk artifacts/ 2>/dev/null || true
          cd artifacts
          tar -czvf ../${{ matrix.target }}.tar.gz .
          cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: ${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-pkgs

      - name: List all downloaded artifacts
        run: |
          ls -la release-pkgs/
          find release-pkgs -name "*.tar.gz" -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          body: |
            Automatically built luci-app-usbmodem for:
            - ramips/mt7621 (WG3526, etc.)
            - x86/64
            - aarch64_generic
          artifacts: release-pkgs/*/*.tar.gz
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}